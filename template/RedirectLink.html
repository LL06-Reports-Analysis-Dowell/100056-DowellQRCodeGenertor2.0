<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <!-- Include Tailwind CSS from CDN -->
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-sm mx-auto p-4 bg-white rounded-lg shadow-lg text-center"> <!-- Added text-center for horizontal centering -->
        <h1 class="text-xl font-bold mb-4">Download Our App</h1>
        <!-- Google Play Button -->
        <a href="https://play.google.com/store/apps/details?id=com.dowellqrcodescanner.app&pli=1" target="_blank" class="block mb-2">
            <button class="bg-green-500 hover:bg-green-600 text-center text-white font-bold py-2 px-4 w-full rounded transition duration-300 ease-in-out">
                Download on Google Play
            </button>
        </a>
        <!-- App Store Button -->
        <a href="https://apps.apple.com/app/idyourappid" target="_blank" class="block text-center">
            <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 w-full rounded transition duration-300 ease-in-out">
                Download on the App Store
            </button>
        </a>
    </div>
</body>
</html>
